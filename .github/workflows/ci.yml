name: CI

on:
  push:
    branches:
      - launch/website
      - surface/**
      - fix/**
      - infra/**
      - ci/**
  pull_request:
    branches:
      - launch/website

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install
        run: npm ci --include=optional --no-audit --no-fund

      - name: Install Linux native CSS binaries
        run: npm install lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save --force --no-package-lock

      - name: Build
        run: npm run build
