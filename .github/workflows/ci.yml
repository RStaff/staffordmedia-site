name: CI

on:
  push:
    branches:
      - launch/website
      - surface/**
      - fix/**
      - infra/**
      - ci/**
  pull_request:
    branches:
      - launch/website

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
